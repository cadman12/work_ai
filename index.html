<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>재고 현황 대시보드</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 좌측 고정 메뉴 + 우측 작업 영역(대시보드 / 상세보기 / 업로드 전환). 밝은 단일 테마. 모바일에서는 메뉴가 상단 띠로 바뀐다. */
:root{
  --bg:#F3F7F6;
  --surface:#FFFFFF;
  --ink:#16262B;
  --muted:#5B6F76;
  --line:#DAE4E3;
  --line-soft:#EAF0EF;
  --head:#F6F9F8;
  --hover:#F7FBFA;
  --nil:#A3B1B5;
  --dash:#B7C9C8;
  --accent:#0E7C86;
  --accent-ink:#0A5F67;
  --accent-soft:#E0F1F2;
  --on-accent:#FFFFFF;
  --good:#2F8A58;
  --warn:#B9780A;
  --crit:#C23B2A;
  --crit-soft:#FBE9E6;
  --c1:#0E7C86;
  --c2:#3D6FD1;
  --c3:#D9962B;
  --c4:#D4604A;
  --c5:#58A06B;
  --c6:#7B8794;
  --other:#B9C6C7;
  --bar-neutral:#C7D2D4;
  --font-body:"IBM Plex Sans KR","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:flex;height:100%;min-height:0}

/* 좌측 메뉴 */
.side{width:236px;flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:22px;padding:20px 14px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px;flex:none}
.brand-mark{width:30px;height:30px;border-radius:7px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand-name{font-weight:700;font-size:15px;line-height:1.2;white-space:nowrap}
.brand-sub{font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-weight:500;text-align:left;cursor:pointer}
.nav-item svg{flex:none}
.nav-item:hover{background:var(--line-soft);color:var(--ink)}
.nav-item[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.datacard{margin-top:auto;border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--bg);min-width:0}
.dc-label{font-size:11px;color:var(--muted);letter-spacing:.04em}
.dc-name{font-weight:600;margin-top:2px;overflow-wrap:anywhere}
.dc-meta{font-size:12px;color:var(--muted);font-family:var(--font-num);font-variant-numeric:tabular-nums}

/* 우측 작업 영역 */
.main{flex:1;min-width:0;overflow-y:auto;padding:24px 28px 48px}
.top{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px 16px;margin-bottom:18px}
.top h1{margin:0;font-size:20px;line-height:1.3;font-weight:700;text-wrap:balance}
.top p{margin:2px 0 0;color:var(--muted);font-size:13px;max-width:60ch}
.top-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.chip{display:inline-flex;align-items:center;max-width:240px;height:28px;padding:0 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.sample{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink);font-weight:500}

.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.fld.inl{flex-direction:row;align-items:center;gap:6px}
.sel{height:34px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);max-width:100%}
.ctrls{display:flex;flex-wrap:wrap;gap:10px 16px;margin-bottom:14px}

.note{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;padding:10px 12px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);font-size:13px;margin-bottom:14px}
.linkbtn{border:0;background:none;padding:0;color:var(--accent-ink);text-decoration:underline;cursor:pointer;font-weight:600}

/* 요약 수치 */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.kpi-l{font-size:12px;color:var(--muted)}
.kpi-v{font-family:var(--font-num);font-size:24px;font-weight:500;line-height:1.3;margin-top:4px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi-v small{font-family:var(--font-body);font-size:13px;color:var(--muted);margin-left:4px}
.kpi-s{font-size:12px;color:var(--muted);min-height:18px}
.kpi.alert .kpi-v{color:var(--crit)}

/* 차트 */
.cgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.s4{grid-column:span 4}.s6{grid-column:span 6}.s8{grid-column:span 8}.s12{grid-column:span 12}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:0}
.card h2{margin:0;font-size:14px;font-weight:600}
.card .sub{font-size:12px;color:var(--muted);margin:2px 0 12px}
.cbox{position:relative;height:270px}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin:-4px 0 8px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.lg .a i{background:var(--c1)}.lg .b i{background:var(--crit)}.lg .c i{background:var(--bar-neutral)}

/* 상세 표 */
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:12px}
.search{flex:1 1 220px;max-width:340px;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.chk{display:flex;align-items:center;gap:6px;font-size:13px}
.count{margin-left:auto;font-size:12px;color:var(--muted)}
.tw{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:calc(100vh - 270px);min-height:200px}
.t{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
.t th{position:sticky;top:0;z-index:1;background:var(--head);border-bottom:1px solid var(--line);padding:0;text-align:left;white-space:nowrap}
.t th.idx{padding:9px 14px;color:var(--muted);font-weight:500;text-align:right}
.th{display:flex;align-items:center;gap:6px;width:100%;padding:9px 14px;border:0;background:none;font-weight:600;cursor:pointer;color:var(--ink);justify-content:flex-start}
.t th.num .th{justify-content:flex-end}
.th:hover{color:var(--accent-ink)}
.ty{font-size:11px;font-weight:500;color:var(--muted);background:var(--line-soft);padding:0 6px;border-radius:999px}
.arr{font-size:9px;color:var(--accent);min-width:9px}
.t td{padding:8px 14px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
.t td.idx{text-align:right;color:var(--muted);font-family:var(--font-num);font-variant-numeric:tabular-nums}
.t td.num{text-align:right;font-family:var(--font-num);font-variant-numeric:tabular-nums}
.t td.dt{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.t td.txt{max-width:260px;overflow:hidden;text-overflow:ellipsis}
.t td.short{color:var(--crit);font-weight:500}
.t tbody tr:hover td{background:var(--hover)}
.t td.empty{text-align:center;color:var(--muted);padding:32px 14px}
.nil{color:var(--nil)}
.pill{display:inline-block;margin-right:8px;padding:0 7px;border-radius:999px;font-size:11px;font-weight:600;background:var(--crit-soft);color:var(--crit);font-family:var(--font-body)}
.pager{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:10px;font-size:13px;color:var(--muted)}
.btn{height:32px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;font-weight:500}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover:not(:disabled){background:var(--accent-ink);border-color:var(--accent-ink);color:var(--on-accent)}

/* 업로드 */
.stack{display:flex;flex-direction:column;gap:14px}
.drop{display:flex;flex-direction:column;align-items:center;gap:10px;padding:34px 20px;border:1.5px dashed var(--dash);border-radius:12px;background:var(--surface);text-align:center}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop p{margin:0}
.drop .big{font-weight:600;font-size:15px}
.drop .hint{color:var(--muted);font-size:12px}
.acts{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.msg{font-size:13px;min-height:20px}
.msg.err{color:var(--crit)}
.msg.ok{color:var(--good)}
.colw{overflow-x:auto}
.ct{border-collapse:collapse;width:100%;font-size:13px}
.ct th{text-align:left;font-weight:600;font-size:12px;color:var(--muted);padding:6px 12px 6px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.ct td{padding:8px 12px 8px 0;border-bottom:1px solid var(--line-soft);vertical-align:top}
.ct td.ex{font-family:var(--font-num);font-variant-numeric:tabular-nums;white-space:nowrap}

@media (max-width:960px){
  .s4,.s6,.s8{grid-column:span 12}
}
@media (max-width:760px){
  .app{flex-direction:column}
  .side{width:auto;flex-direction:row;align-items:center;gap:8px;padding:10px 16px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden}
  .brand{padding:0}
  .brand-sub,.datacard{display:none}
  .nav{flex-direction:row;gap:4px}
  .nav-item{width:auto;white-space:nowrap}
  .main{padding:18px 16px 40px}
  .tw{max-height:70vh}
  .count{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>

<div class="app">
  <aside class="side">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="2" y="9" width="3" height="7" rx="1" fill="#fff"/><rect x="7.5" y="5" width="3" height="11" rx="1" fill="#fff"/><rect x="13" y="2" width="3" height="14" rx="1" fill="#fff"/></svg>
      </span>

    <nav class="nav" aria-label="메뉴">
      <button type="button" class="nav-item" data-view="dashboard">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="6" height="7" rx="1.5"/><rect x="10" y="2" width="6" height="4" rx="1.5"/><rect x="2" y="11" width="6" height="5" rx="1.5"/><rect x="10" y="8" width="6" height="8" rx="1.5"/></svg>
        <span>대시보드</span>

      <button type="button" class="nav-item" data-view="detail">

        <span>상세보기</span>

      <button type="button" class="nav-item" data-view="upload">

    <div class="datacard">

  <main class="main" id="main">
    <header class="top">
      <div>
        <h1 id="vTitle"></h1>
        <p id="vDesc"></p>
      </div>
      <div class="top-r">
        <div class="fld inl" id="sheetWrap" hidden>
          <label for="selSheet">시트</label>
          <select id="selSheet" class="sel"></select>
        </div>
        <span class="chip" id="srcChip"></span>
      </div>
    </header>

    <section id="v-dashboard">
      <div class="note" id="sampleNote">
        <span>예시 데이터를 보고 있습니다. 파일을 올리면 내 데이터로 바뀝니다.</span>

      </div>
      <div class="ctrls" id="dashCtrls">
        <div class="fld"><label for="selMetric">수치 열</label><select id="selMetric" class="sel"></select></div>
        <div class="fld"><label for="selGroup">묶는 기준</label><select id="selGroup" class="sel"></select></div>
        <div class="fld"><label for="selAgg">집계 방식</label>
          <select id="selAgg" class="sel"><option value="sum">합계</option><option value="avg">평균</option></select>

      <div class="kpis" id="kpis"></div>
      <div class="cgrid" id="charts">
        <div class="card s8">

          <div class="lg"><span class="a"><i></i>현재고</span><span class="b"><i></i>안전재고 미달</span><span class="c"><i></i>안전재고</span></div>
          <div class="cbox"><canvas id="cShort" aria-label="안전재고 대비 현재고 막대 차트" role="img"></canvas></div>
        </div>
      </div>
      <div class="card" id="noNum" hidden>
        <h2>차트를 만들 수 없습니다</h2>

      </div>
    </section>

    <section id="v-detail" hidden>
      <div class="tools">

        <label class="chk" id="shortWrap" hidden><input type="checkbox" id="onlyShort"> 안전재고 미달만 보기</label>
        <div class="fld inl"><label for="selSize">표시 행</label>
          <select id="selSize" class="sel"><option value="20">20</option><option value="50">50</option><option value="100">100</option></select>
        </div>
        <span class="count" id="count"></span>
      </div>
      <div class="tw"><table class="t" id="tbl"></table></div>
      <div class="pager">
        <button type="button" class="btn" id="prev">이전</button>
        <span id="pgInfo"></span>
        <button type="button" class="btn" id="next">다음</button>
      </div>

    <section id="v-upload" hidden>

          <div class="acts">
            <button type="button" class="btn primary" id="pick">파일 선택</button>

(function(){
'use strict';
const NF=new Intl.NumberFormat('ko-KR',{maximumFractionDigits:2});
const CF=new Intl.NumberFormat('ko-KR',{notation:'compact',maximumFractionDigits:1});
const $=id=>document.getElementById(id);
const TY={number:'숫자',text:'문자',date:'날짜'};
const IDRE=/(코드|번호|아이디|우편|연락처|바코드|\bid\b|code|sku|barcode)/i;
const NUMRE=/^[-+]?\d{1,3}(,\d{3})+(\.\d+)?$|^[-+]?\d+(\.\d+)?$/;
const DATERE=/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})$/;
const VIEWS={
  dashboard:['대시보드','수치 열은 차트로, 묶는 기준별로 비교해서 보여 줍니다.'],
  detail:['상세보기','열 형식에 맞춰 표로 보여 줍니다. 열 이름을 누르면 정렬됩니다.'],
  upload:['엑셀 업로드','첫 번째 시트의 첫 행을 열 이름으로 읽습니다.']
};
const S={view:'dashboard',name:'',sample:true,sheet:'',wb:null,headers:[],types:[],rows:[],
  sort:{col:-1,dir:1},page:0,size:20,q:'',onlyShort:false,metric:-1,group:-1,agg:'sum',stock:-1,safe:-1,label:-1};
const CH={};
const p2=n=>('0'+n).slice(-2);
const fmtDate=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- 예시 데이터 ---------- */
function sampleData(){
  let s=20261013;
  const rnd=()=>{s=(s+0x6D2B79F5)|0;let t=Math.imul(s^(s>>>15),1|s);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};
  const cats=[
    ['전자부품','EL',[['저항 10kΩ','개',20,60,8000],['세라믹 커패시터 100nF','개',30,90,6000],['전해 커패시터 100μF','개',120,300,2500],['MCU 32비트 보드','개',3800,6200,300],['6핀 커넥터','개',150,400,3000],['12V 릴레이','개',900,1800,600],['LED 모듈 5mm','개',60,150,4000],['온도 센서 모듈','개',1800,3400,500]]],
    ['포장재','PK',[['골판지 박스 M','장',450,900,1800],['에어캡 롤','롤',7000,12000,120],['박스 테이프 48mm','롤',900,1600,500],['스트레치 필름','롤',5500,9000,160],['완충 폼 시트','장',300,700,900],['PE 지퍼백 20×30','팩',2500,4800,260]]],
    ['공구','TL',[['토크 렌치','개',48000,95000,25],['정밀 드라이버 세트','세트',12000,28000,60],['디지털 캘리퍼스','개',22000,45000,40],['육각렌치 세트','세트',6000,15000,90],['전동 드릴','대',85000,160000,18],['줄자 5m','개',2500,6000,150]]],
    ['소모품','CS',[['면장갑','켤레',700,1500,1200],['KF94 마스크','장',350,700,3000],['윤활 스프레이','캔',2800,6500,300],['세척제 1L','병',3500,8000,200],['라벨 용지','권',4000,9000,180],['결속밴드 300mm','봉',1800,3500,400]]],
    ['원자재','RM',[['알루미늄 판재 2T','장',38000,62000,90],['스테인리스 파이프','m',4200,8500,600],['구리선 1.5sq','롤',56000,98000,40],['ABS 펠릿 25kg','포',52000,78000,70],['고무 패킹','개',400,1100,2200],['PVC 호스 1/2인치','m',900,2100,800]]]
  ];
  const wh=['A동','B동','C동'];
  const rows=[];
  cats.forEach(c=>c[2].forEach((it,k)=>{
    const safe=Math.max(5,Math.round(it[4]*0.3*(0.7+rnd()*0.6)));
    const stock=Math.round(safe*(0.35+rnd()*2.6));
    let p=it[2]+rnd()*(it[3]-it[2]);
    p=p>=1000?Math.round(p/10)*10:Math.round(p);
    const d=new Date(2026,8,1+Math.floor(rnd()*42));
    rows.push([c[1]+'-'+('00'+(k+1)).slice(-3),it[0],c[0],wh[Math.floor(rnd()*3)],it[1],stock,safe,p,stock*p,d]);
  }));
  return {headers:['품목코드','품명','분류','창고','단위','현재고','안전재고','단가(원)','재고금액(원)','최근 입고일'],rows:rows};
}

/* ---------- 표 만들기 · 형식 판별 ---------- */
function inferType(h,vals){
  const v=vals.filter(x=>x!==null);
  if(!v.length||IDRE.test(h))return 'text';
  let nn=0,nd=0;
  v.forEach(x=>{
    if(x instanceof Date)nd++;
    else if(typeof x==='number'&&isFinite(x))nn++;
    else if(typeof x==='string'){const t=x.replace(/\s/g,'');if(DATERE.test(t))nd++;else if(NUMRE.test(t))nn++;}
  });
  if(nd/v.length>=0.9)return 'date';
  if(nn/v.length>=0.9)return 'number';
  return 'text';
}
function convert(x,t){
  if(x===null)return null;
  if(t==='number'){
    if(typeof x==='number')return isFinite(x)?x:null;
    if(typeof x==='string'){const n=Number(x.replace(/[,\s]/g,''));return isFinite(n)?n:null;}
    return null;
  }
  if(t==='date'){
    if(x instanceof Date)return isNaN(x)?null:new Date(x.getTime()+60000);
    if(typeof x==='string'){const m=x.replace(/\s/g,'').match(DATERE);if(m)return new Date(+m[1],+m[2]-1,+m[3]);}
    return null;
  }
  if(x instanceof Date)return fmtDate(x);
  return String(x);
}
function buildTable(rawHeaders,aoa){
  const headers=rawHeaders.map((h,i)=>{const t=(h==null?'':String(h)).trim();return t||('열'+(i+1));});
  const seen={};
  headers.forEach((h,i)=>{if(seen[h]){seen[h]++;headers[i]=h+' ('+seen[h]+')';}else seen[h]=1;});
  const n=headers.length;
  const rows=aoa.map(r=>{
    const o=[];
    for(let i=0;i<n;i++){
      let v=r[i];
      if(v===undefined||v==='')v=null;
      if(typeof v==='string'){v=v.trim();if(v==='')v=null;}
      o.push(v);
    }
    return o;
  }).filter(r=>r.some(v=>v!==null));
  const types=headers.map((h,c)=>inferType(h,rows.map(r=>r[c])));
  types.forEach((t,c)=>rows.forEach(r=>{r[c]=convert(r[c],t);}));
  return {headers:headers,types:types,rows:rows};
}
function uniq(c){const s=new Set();S.rows.forEach(r=>{if(r[c]!==null)s.add(r[c]);});return s.size;}
function detect(){
  const H=S.headers,T=S.types,n=H.length;
  const find=(re,skip)=>{for(let i=0;i<n;i++){if(T[i]==='number'&&i!==skip&&re.test(H[i]))return i;}return -1;};
  S.stock=find(/(현재고|재고\s*수량|현재\s*수량|재고량|^재고$|^stock$|on.?hand)/i,-1);
  S.safe=find(/(안전\s*재고|안전\s*수량|최소\s*재고|safety|reorder|min\s*stock)/i,S.stock);
  const nums=[],txts=[];
  for(let i=0;i<n;i++){if(T[i]==='number')nums.push(i);else if(T[i]==='text')txts.push(i);}
  S.metric=-1;
  [/재고\s*금액|금액|amount|value/i,/현재고|재고|수량|qty|stock/i].some(re=>{
    const i=nums.find(j=>re.test(H[j]));
    if(i!==undefined){S.metric=i;return true;}
    return false;
  });
  if(S.metric<0&&nums.length)S.metric=nums[0];
  const g=txts.find(c=>{const u=uniq(c);return u>=2&&u<=12;});
  S.group=g!==undefined?g:(txts.length?txts[0]:-1);
  const pref=txts.find(c=>/(품명|이름|명칭|제품|상품|품목|name)/i.test(H[c])&&!IDRE.test(H[c]));
  if(pref!==undefined)S.label=pref;
  else{let best=-1,bu=0;txts.forEach(c=>{const u=uniq(c);if(u>bu){bu=u;best=c;}});S.label=best;}
}
const hasShort=()=>S.stock>=0&&S.safe>=0;
const isShort=r=>hasShort()&&r[S.stock]!==null&&r[S.safe]!==null&&r[S.stock]<r[S.safe];
const rowLabel=i=>(S.label>=0&&S.rows[i][S.label]!==null)?String(S.rows[i][S.label]):'행 '+(i+1);

/* ---------- 불러오기 ---------- */
function load(rawHeaders,aoa,name,isSample){
  const t=buildTable(rawHeaders,aoa);
  S.headers=t.headers;S.types=t.types;S.rows=t.rows;S.name=name;S.sample=isSample;
  S.sort={col:-1,dir:1};S.page=0;S.q='';S.onlyShort=false;S.agg='sum';
  $('q').value='';$('onlyShort').checked=false;$('selAgg').value='sum';
  detect();
  refreshChrome();
  renderUploadCols();
}
function loadSample(){
  const d=sampleData();
  S.wb=null;S.sheet='';
  load(d.headers,d.rows,'예시 데이터',true);
}
function loadSheet(name){
  const aoa=XLSX.utils.sheet_to_json(S.wb.Sheets[name],{header:1,raw:true,defval:null,blankrows:false});
  if(aoa.length<2){msg('“'+name+'” 시트에 데이터가 없습니다. 첫 행에 열 이름, 아래 행에 값이 있는지 확인하세요.','err');return false;}
  S.sheet=name;
  load(aoa[0],aoa.slice(1),S.fileName,false);
  return true;
}
function msg(t,kind){const m=$('msg');m.textContent=t;m.className='msg'+(kind?' '+kind:'');}
function handleFile(file){
  msg('');
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  if(['xlsx','xls','csv'].indexOf(ext)<0){msg('엑셀(.xlsx, .xls) 또는 CSV 파일만 올릴 수 있습니다.','err');return;}
  if(typeof XLSX==='undefined'){msg('엑셀 읽기 도구를 불러오지 못했습니다. 페이지를 새로고침한 뒤 다시 시도하세요.','err');return;}
  const fr=new FileReader();
  fr.onerror=()=>msg('파일을 읽지 못했습니다. 다른 프로그램에서 열려 있지 않은지 확인하고 다시 올려 주세요.','err');
  fr.onload=()=>{
    try{
      const wb=ext==='csv'?XLSX.read(fr.result,{type:'string',cellDates:true}):XLSX.read(fr.result,{type:'array',cellDates:true});
      if(!wb.SheetNames.length){msg('시트를 찾지 못했습니다.','err');return;}
      const prev={wb:S.wb,fileName:S.fileName};
      S.wb=wb;S.fileName=file.name;
      if(!loadSheet(wb.SheetNames[0])){S.wb=prev.wb;S.fileName=prev.fileName;return;}
      msg('');
      show('dashboard');
    }catch(e){
      msg('파일을 해석하지 못했습니다. 손상되었거나 암호가 걸린 파일일 수 있습니다.','err');
    }
  };
  if(ext==='csv')fr.readAsText(file,'utf-8');else fr.readAsArrayBuffer(file);
}

function refreshChrome(){
  $('dcName').textContent=S.name;

function show(v){

/* ---------- 대시보드 ---------- */
function aggBy(g,m,agg){
  const map=new Map();
  S.rows.forEach(r=>{
    const v=r[m];if(v===null)return;
    const k=g<0?'전체':(r[g]===null?'(빈 값)':String(r[g]));
    const o=map.get(k)||{s:0,n:0};o.s+=v;o.n++;map.set(k,o);
  });
  return Array.from(map).map(e=>({k:e[0],v:agg==='avg'?e[1].s/e[1].n:e[1].s})).sort((a,b)=>b.v-a.v);
}
const big=v=>Math.abs(v)>=1e8?CF.format(v):NF.format(v);
function kpi(l,v,s,alert,t){
  return '<div class="kpi'+(alert?' alert':'')+'"><div class="kpi-l">'+esc(l)+'</div><div class="kpi-v"'+(t?' title="'+esc(t)+'"':'')+'>'+v+'</div><div class="kpi-s">'+s+'</div></div>';
}
function renderKpis(){
  let h=kpi('전체 행 수',NF.format(S.rows.length)+'<small>행</small>',S.headers.length+'개 열');
  if(S.metric>=0){
    const m=S.metric,mn=S.headers[m];
    let sum=0,cnt=0,max=-Infinity,mi=-1;
    S.rows.forEach((r,i)=>{const v=r[m];if(v===null)return;sum+=v;cnt++;if(v>max){max=v;mi=i;}});
    h+=kpi(mn+' 합계',big(sum),'값이 있는 '+NF.format(cnt)+'행 합산',false,NF.format(sum));
    h+=kpi(mn+' 평균',big(cnt?sum/cnt:0),NF.format(cnt)+'행 평균',false,NF.format(cnt?sum/cnt:0));
    if(hasShort()){
      const n=S.rows.filter(isShort).length;
      const pct=S.rows.length?Math.round(n/S.rows.length*100):0;
      h+=kpi('안전재고 미달',NF.format(n)+'<small>건</small>','전체의 '+pct+'%',n>0);
    }else if(mi>=0){
      h+=kpi(mn+' 최댓값',big(max),esc(rowLabel(mi)),false,NF.format(max));
    }
  }
  $('kpis').innerHTML=h;
}
function put(id,cfg){if(CH[id])CH[id].destroy();CH[id]=new Chart($(id),cfg);}
function renderDash(){
  const has=S.metric>=0;

  const idx=S.rows.map((r,i)=>i).filter(i=>S.rows[i][S.metric]!==null).sort((a,b)=>S.rows[b][S.metric]-S.rows[a][S.metric]).slice(0,10);
  $('tTop').textContent=mName+' 상위 10';

    arr.sort((x,y)=>x.q-y.q);arr=arr.slice(0,8);
  }

        {label:S.headers[S.safe],data:arr.map(d=>d.b),backgroundColor:tok('--bar-neutral'),borderRadius:3,barPercentage:.85,categoryPercentage:.8}
      ]},
      options:Object.assign({},base,{
        indexAxis:'y',
        plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' '+c.dataset.label+': '+NF.format(c.parsed.x)}}},
        scales:{x:{beginAtZero:true,ticks:{callback:x=>CF.format(x)}},y:{grid:{display:false},ticks:{callback:trunc}}}
      })});
  }
}

/* ---------- 상세 표 ---------- */
function viewIdx(){
  const q=S.q.trim().toLowerCase();
  let out=[];
  for(let i=0;i<S.rows.length;i++){
    const r=S.rows[i];
    if(S.onlyShort&&!isShort(r))continue;
    if(q){
      let hit=false;
      for(let c=0;c<r.length;c++){
        const v=r[c];if(v===null)continue;
        const s=(v instanceof Date)?fmtDate(v):(typeof v==='number'?String(v)+' '+NF.format(v):String(v));
        if(s.toLowerCase().indexOf(q)>-1){hit=true;break;}
      }
      if(!hit)continue;
    }
    out.push(i);
  }
  if(S.sort.col>=0){
    const c=S.sort.col,d=S.sort.dir,t=S.types[c];
    out.sort((a,b)=>{
      const x=S.rows[a][c],y=S.rows[b][c];
      if(x===null&&y===null)return 0;
      if(x===null)return 1;
      if(y===null)return -1;
      const r=t==='text'?String(x).localeCompare(String(y),'ko'):x-y;
      return r*d;
    });
  }
  return out;
}
function cell(c,v,r){
  const t=S.types[c];
  if(v===null)return '<td class="'+(t==='number'?'num':t==='date'?'dt':'txt')+'"><span class="nil">—</span></td>';
  if(t==='number'){
    const short=isShort(r)&&c===S.stock;
    return '<td class="num'+(short?' short':'')+'">'+(short?'<span class="pill">부족</span>':'')+NF.format(v)+'</td>';
  }
  if(t==='date')return '<td class="dt">'+fmtDate(v)+'</td>';
  return '<td class="txt" title="'+esc(v)+'">'+esc(v)+'</td>';
}
function renderTable(){
  const idx=viewIdx();
  const total=idx.length;
  const pages=Math.max(1,Math.ceil(total/S.size));
  if(S.page>=pages)S.page=pages-1;
  if(S.page<0)S.page=0;
  const start=S.page*S.size;
  const slice=idx.slice(start,start+S.size);
  let h='<thead><tr><th class="idx">#</th>';
  S.headers.forEach((name,c)=>{
    const t=S.types[c];
    const on=S.sort.col===c;
    h+='<th class="'+(t==='number'?'num':'')+'" aria-sort="'+(on?(S.sort.dir===1?'ascending':'descending'):'none')+'"><button type="button" class="th" data-c="'+c+'"><span>'+esc(name)+'</span><span class="ty">'+TY[t]+'</span><span class="arr">'+(on?(S.sort.dir===1?'▲':'▼'):'')+'</span></button></th>';
  });
  h+='</tr></thead><tbody>';
  if(!slice.length){
    h+='<tr><td class="empty" colspan="'+(S.headers.length+1)+'">조건에 맞는 행이 없습니다.</td></tr>';
  }else{
    slice.forEach(i=>{
      const r=S.rows[i];
      h+='<tr><td class="idx">'+(i+1)+'</td>';
      for(let c=0;c<r.length;c++)h+=cell(c,r[c],r);
      h+='</tr>';
    });
  }
  h+='</tbody>';
  $('tbl').innerHTML=h;
  $('count').textContent=total===S.rows.length?'전체 '+NF.format(total)+'행':NF.format(total)+'행 / 전체 '+NF.format(S.rows.length)+'행';
  $('pgInfo').textContent=(S.page+1)+' / '+pages;
  $('prev').disabled=S.page<=0;
  $('next').disabled=S.page>=pages-1;
}

/* ---------- 업로드 화면: 인식된 열 ---------- */
function renderUploadCols(){
  const how={number:'오른쪽 정렬 · 천 단위 쉼표 · 차트에 사용',text:'왼쪽 정렬 · 묶는 기준으로 사용',date:'yyyy-mm-dd 형식으로 표시'};
  let h='<thead><tr><th>열 이름</th><th>형식</th><th>표시 방식</th><th>첫 값</th></tr></thead><tbody>';
  S.headers.forEach((name,c)=>{
    let ex='—';
    for(let i=0;i<S.rows.length;i++){
      const v=S.rows[i][c];
      if(v!==null){ex=S.types[c]==='number'?NF.format(v):S.types[c]==='date'?fmtDate(v):String(v);break;}
    }
    h+='<tr><td>'+esc(name)+'</td><td>'+TY[S.types[c]]+'</td><td>'+how[S.types[c]]+'</td><td class="ex">'+esc(ex)+'</td></tr>';
  });
  $('colTbl').innerHTML=h+'</tbody>';
}

/* ---------- 이벤트 ---------- */
document.querySelectorAll('.nav-item').forEach(b=>b.addEventListener('click',()=>show(b.dataset.view)));
document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.go)));
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(VIEWS[v]&&v!==S.view)show(v);});
$('selMetric').addEventListener('change',e=>{S.metric=+e.target.value;renderDash();});
$('selGroup').addEventListener('change',e=>{S.group=+e.target.value;renderDash();});
$('selAgg').addEventListener('change',e=>{S.agg=e.target.value;renderDash();});
$('selSheet').addEventListener('change',e=>{if(S.wb)loadSheet(e.target.value);});
$('q').addEventListener('input',e=>{S.q=e.target.value;S.page=0;renderTable();});
$('onlyShort').addEventListener('change',e=>{S.onlyShort=e.target.checked;S.page=0;renderTable();});
$('selSize').addEventListener('change',e=>{S.size=+e.target.value;S.page=0;renderTable();});
$('prev').addEventListener('click',()=>{S.page--;renderTable();});
$('next').addEventListener('click',()=>{S.page++;renderTable();});
$('tbl').addEventListener('click',e=>{
  const b=e.target.closest('.th');if(!b)return;
  const c=+b.dataset.c;
  if(S.sort.col===c)S.sort.dir*=-1;else S.sort={col:c,dir:1};
  S.page=0;renderTable();
});
$('pick').addEventListener('click',()=>$('fileIn').click());
$('fileIn').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(f)handleFile(f);e.target.value='';});
$('useSample').addEventListener('click',()=>{loadSample();msg('예시 데이터로 되돌렸습니다.','ok');});
const drop=$('drop');
['dragenter','dragover'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.add('over');}));
['dragleave','drop'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.remove('over');}));
drop.addEventListener('drop',e=>{const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(f)handleFile(f);});

loadSample();
show(location.hash.slice(1));
})();
</script>
